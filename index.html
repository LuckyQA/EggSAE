<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f7f8;
            --surface: #ffffff;
            --text: #18181b;
            --muted: #8a8a93;
            --border: #e8e8ec;
            --primary: #7c3aed;
            --primary-soft: #f3eefd;
            --gold: #b45309;
            --green: #15803d;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', Tahoma, sans-serif;
            background:
                radial-gradient(900px 500px at 50% -10%, #ede9fe 0%, transparent 60%),
                var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2.5rem 1.5rem 3.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #d9d9e0; border-radius: 8px; border: 2px solid var(--bg); }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ===== Animations ===== */
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0) scale(1); }
            25% { transform: rotate(-10deg) scale(1.12); }
            75% { transform: rotate(10deg) scale(1.12); }
        }
        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(28px) scale(0.88); }
            60% { opacity: 1; transform: translateY(-8px) scale(1.03); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        @keyframes modalPop {
            0% { transform: scale(0.7) translateY(24px); opacity: 0; }
            60% { transform: scale(1.04) translateY(-5px); opacity: 1; }
            80% { transform: scale(0.98) translateY(0); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes tick {
            0% { transform: scale(1.15); }
            25% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,.45); }
            50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
        }

        .logo {
            width: 60px; height: 60px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.9rem;
            box-shadow: 0 4px 14px -4px rgba(24,24,27,0.08);
            margin-bottom: 14px;
            animation: floaty 3s ease-in-out infinite;
            cursor: pointer;
        }
        .logo:hover { animation: wiggle .5s var(--spring); }
        h1 { margin: 0; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; animation: cardIn .5s var(--spring) both; }
        .subtitle {
            margin: 8px 0 0; font-size: .8rem; color: var(--muted);
            display: flex; align-items: center; gap: 7px; font-weight: 500;
        }
        .live-dot {
            width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* ===== Search ===== */
        .search-wrap { position: relative; width: 100%; max-width: 420px; margin: 1.75rem 0 2.25rem; animation: cardIn .5s var(--spring) .08s both; }
        .search-wrap .search-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--muted); font-size: .9rem; pointer-events: none;
        }
        .search-box {
            width: 100%; padding: 12px 16px 12px 42px;
            border-radius: 999px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
            font-size: .95rem; font-family: inherit;
            box-shadow: 0 1px 2px rgba(24,24,27,.04);
            transition: border-color .15s, box-shadow .15s, transform .35s var(--spring);
        }
        .search-box::placeholder { color: #b0b0b8; }
        .search-box:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
            transform: scale(1.03);
        }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem; width: 100%; max-width: 1020px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.25rem 1.35rem;
            box-shadow: 0 1px 2px rgba(24,24,27,.04);
            transition: transform .4s var(--spring), box-shadow .3s ease, border-color .3s ease;
            animation: cardIn .55s var(--spring) both;
        }
        .card:hover {
            transform: translateY(-7px) scale(1.02);
            box-shadow: 0 20px 40px -14px rgba(24,24,27,.16);
            border-color: #d9d9e0;
        }
        .card:active { transform: translateY(-2px) scale(.99); }
        .card-header { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
        .avatar {
            width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 1rem;
            transition: transform .4s var(--spring);
            animation: popIn .5s var(--spring) both;
        }
        .card:hover .avatar { transform: rotate(-10deg) scale(1.15); }
        .username {
            font-weight: 700; font-size: 1.02rem; letter-spacing: -0.01em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .eggs-btn {
            margin-left: auto;
            background: var(--primary-soft); border: 1px solid transparent;
            color: var(--primary); font-family: inherit;
            font-size: .74rem; font-weight: 600; letter-spacing: .01em;
            padding: 6px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
            transition: background .15s, color .15s, transform .35s var(--spring);
        }
        .eggs-btn:hover { background: var(--primary); color: #fff; transform: translateY(-2px) scale(1.08); }
        .eggs-btn:active { transform: scale(.88); }

        .stat {
            display: flex; justify-content: space-between; align-items: center;
            padding: 7.5px 0; font-size: .9rem;
        }
        .stat + .stat { border-top: 1px dashed var(--border); }
        .stat-label { color: var(--muted); font-weight: 500; }
        .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }
        .val-egg   { color: var(--gold); font-weight: 700; }
        .val-money { color: var(--green); font-weight: 700; }
        .timer {
            font-weight: 700; color: var(--primary);
            background: var(--primary-soft);
            padding: 2.5px 11px; border-radius: 999px; font-size: .84rem;
            animation: tick 1s ease-in-out infinite; /* เด้งเบา ๆ ทุกวินาที */
        }
        .no-results {
            grid-column: 1 / -1; text-align: center;
            color: var(--muted); padding: 3.5rem 0; font-size: .95rem;
            animation: cardIn .5s var(--spring) both;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(24,24,27,.35);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            z-index: 100; padding: 1rem;
        }
        .modal-overlay.active { display: flex; animation: fadeIn .2s ease; }
        .modal {
            background: var(--surface); border-radius: 20px;
            width: 100%; max-width: 440px; max-height: 72vh;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 64px -16px rgba(0,0,0,.28);
            animation: modalPop .45s var(--spring);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--border);
        }
        .modal-title { font-weight: 700; font-size: .98rem; }
        .modal-title span { color: var(--primary); }
        .modal-close {
            width: 30px; height: 30px; border-radius: 50%;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); font-size: .85rem; cursor: pointer;
            transition: background .15s, color .15s, transform .4s var(--spring);
        }
        .modal-close:hover { background: #f4f4f5; color: var(--text); transform: rotate(90deg) scale(1.12); }
        .modal-close:active { transform: rotate(90deg) scale(.85); }
        .modal-body {
            padding: 1.1rem 1.3rem; overflow-y: auto;
            display: flex; flex-direction: column; gap: .55rem;
        }
        .empty-state { color: var(--muted); text-align: center; padding: 1.75rem 0; font-size: .92rem; animation: cardIn .45s var(--spring) both; }

        .egg-row {
            display: flex; align-items: center; gap: 10px;
            padding: 9px; background: #fafafa;
            border: 1px solid var(--border); border-radius: 13px;
            animation: cardIn .5s var(--spring) both;
            transition: transform .3s var(--spring), border-color .2s;
        }
        .egg-row:hover { transform: scale(1.025); border-color: #d6d6de; }
        .egg-icon { width: 36px; height: 36px; object-fit: contain; flex-shrink: 0; }
        .egg-fallback {
            display: flex; align-items: center; justify-content: center;
            font-size: 21px; background: var(--primary-soft); border-radius: 11px;
        }
        .pop { animation: popIn .5s var(--spring) both; }
        .egg-bar { position: relative; flex: 1; height: 28px; background: #232329; border-radius: 8px; overflow: hidden; }
        .egg-fill {
            position: absolute; left: 0; top: 0; bottom: 0; width: 0;
            background: linear-gradient(90deg, #34d058, #22863a);
            transition: width .9s var(--spring);
        }
        .egg-time {
            position: relative; z-index: 1; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .83rem; color: #fff;
            letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.5);
        }

        .footer { margin-top: 2.5rem; font-size: .78rem; color: var(--muted); text-align: center; animation: cardIn .5s var(--spring) .15s both; }

        @media (max-width: 520px) {
            body { padding: 1.75rem 1rem 2.5rem; }
            h1 { font-size: 1.45rem; }
            .grid { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="logo" id="logo">🥚</div>
    <h1>Steal An Egg</h1>
    <p class="subtitle"><span class="live-dot"></span> LIVE — auto updating</p>

    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-box" placeholder="Search...">
    </div>

    <div class="grid" id="dataGrid"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Eggs — <span id="modalUser"></span></div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">Steal An Egg</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://key1-ab4b3-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const serversRef = ref(db, 'servers');
        let currentData = {};
        let modalCurrentUser = null;
        let lastRenderedJson = null;

        function getRealWorldResetTimer() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const cycleLength = 300;
            const remainingSeconds = cycleLength - (nowInSeconds % cycleLength);
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function abbreviateNumber(num) {
            num = Number(num) || 0;
            const abs = Math.abs(num);
            const sign = num < 0 ? '-' : '';
            const units = [
                { v: 1e12, s: 't' },
                { v: 1e9,  s: 'b' },
                { v: 1e6,  s: 'm' },
                { v: 1e3,  s: 'k' }
            ];
            for (const u of units) {
                if (abs >= u.v) {
                    const n = (abs / u.v).toFixed(2).replace(/\.?0+$/, '');
                    return sign + n + u.s;
                }
            }
            return sign + String(abs);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        const AVATAR_COLORS = ['#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#14b8a6', '#f97316'];
        function avatarColor(name) {
            let h = 0;
            for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
            return AVATAR_COLORS[h % AVATAR_COLORS.length];
        }

        onValue(serversRef, (snapshot) => {
            currentData = snapshot.val() || {};
            renderCards();
            if (modalCurrentUser) {
                if (currentData[modalCurrentUser]) renderModalBody();
                else closeModal();
            }
        });

        function renderCards(force = false) {
            const dataJson = JSON.stringify(currentData);
            if (!force && dataJson === lastRenderedJson) return;
            lastRenderedJson = dataJson;

            const grid = document.getElementById('dataGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const resetTime = getRealWorldResetTimer();
            grid.innerHTML = '';
            const now = Date.now();
            let shown = 0;

            for (const [username, data] of Object.entries(currentData)) {
                if (now - data.lastUpdated > 120000) continue;

                if (username.toLowerCase().includes(search)) {
                    const moneyText = (data.money && String(data.money).trim() !== '')
                        ? escapeHtml(data.money)
                        : '-';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.animationDelay = `${Math.min(shown * 0.07, 0.5)}s`;
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="avatar" style="background:${avatarColor(username)}; animation-delay:${Math.min(shown * 0.07, 0.5) + 0.15}s">${escapeHtml(username[0].toUpperCase())}</div>
                            <div class="username">${escapeHtml(username)}</div>
                            <button class="eggs-btn" data-user="${escapeHtml(username)}">Eggs</button>
                        </div>
                        <div class="stat"><span class="stat-label">🥚 Rare Eggs</span><span class="stat-value val-egg">${data.eggCount} ฟอง</span></div>
                        <div class="stat"><span class="stat-label">💰 Money</span><span class="stat-value val-money">${moneyText}</span></div>
                        <div class="stat"><span class="stat-label">⚡ Speed</span><span class="stat-value">${abbreviateNumber(data.speed)}</span></div>
                        <div class="stat"><span class="stat-label">👥 Players</span><span class="stat-value">${data.playerCount} คน</span></div>
                        <div class="stat"><span class="stat-label">🔄 Reset In</span><span class="stat-value timer reset-timer">${resetTime}</span></div>
                    `;
                    grid.appendChild(card);
                    shown++;
                }
            }

            if (shown === 0) {
                grid.innerHTML = `<div class="no-results">🔍 ไม่พบผู้เล่น</div>`;
            }
        }

        const thumbCache = new Map();

        async function getThumbUrl(assetId) {
            if (!assetId) return null;
            if (thumbCache.has(assetId)) return thumbCache.get(assetId);
            try {
                const res = await fetch(
                    `https://thumbnails.roblox.com/v1/assets?assetIds=${encodeURIComponent(assetId)}&size=150x150&format=Png&isCircular=false`
                );
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                const url = json?.data?.[0]?.imageUrl || null;
                thumbCache.set(assetId, url);
                return url;
            } catch {
                thumbCache.set(assetId, null);
                return null;
            }
        }

        function makeFallbackIcon() {
            const fb = document.createElement('span');
            fb.className = 'egg-icon egg-fallback pop';
            fb.textContent = '🥚';
            return fb;
        }

        function attachEggIcon(slot, rawIcon) {
            const id = String(rawIcon ?? '').trim();
            if (/^\d+$/.test(id)) {
                getThumbUrl(id).then(url => {
                    if (!url) return;
                    const img = document.createElement('img');
                    img.className = 'egg-icon pop';
                    img.src = url;
                    img.onerror = () => img.replaceWith(makeFallbackIcon());
                    slot.replaceWith(img);
                });
            } else if (id) {
                const img = document.createElement('img');
                img.className = 'egg-icon pop';
                img.src = id;
                img.onerror = () => img.replaceWith(makeFallbackIcon());
                slot.replaceWith(img);
            }
        }

        function normalizeEggs(eggs) {
            if (!eggs) return [];
            if (Array.isArray(eggs)) return eggs;
            return Object.keys(eggs).sort((a, b) => Number(a) - Number(b)).map(k => eggs[k]);
        }

        function createEggRow(egg, index) {
            const row = document.createElement('div');
            row.className = 'egg-row';
            row.style.animationDelay = `${Math.min(index * 0.06, 0.4)}s`;

            const iconSlot = makeFallbackIcon();
            attachEggIcon(iconSlot, egg.icon);
            row.appendChild(iconSlot);

            const bar = document.createElement('div');
            bar.className = 'egg-bar';

            const fill = document.createElement('div');
            fill.className = 'egg-fill';
            const pct = Math.max(0, Math.min(1, Number(egg.fill) || 0));
            requestAnimationFrame(() => { fill.style.width = (pct * 100) + '%'; });
            bar.appendChild(fill);

            const time = document.createElement('span');
            time.className = 'egg-time';
            time.textContent = egg.time || '';
            bar.appendChild(time);

            row.appendChild(bar);
            return row;
        }

        function renderModalBody() {
            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const userData = currentData[modalCurrentUser];
            const eggs = normalizeEggs(userData ? userData.eggs : null);

            if (eggs.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'ไม่มีไข่ที่กำลังฟัก';
                body.appendChild(empty);
                return;
            }

            eggs.forEach((egg, i) => body.appendChild(createEggRow(egg, i)));
        }

        function openModal(username) {
            modalCurrentUser = username;
            document.getElementById('modalUser').textContent = username;
            renderModalBody();
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            modalCurrentUser = null;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('dataGrid').addEventListener('click', (e) => {
            const btn = e.target.closest('.eggs-btn');
            if (btn) openModal(btn.dataset.user);
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('logo').addEventListener('click', function () {
            this.style.animation = 'none';
            void this.offsetWidth;
            this.style.animation = 'wiggle .5s var(--spring)';
        });

        setInterval(() => {
            const resetTime = getRealWorldResetTimer();
            document.querySelectorAll('.reset-timer').forEach(el => {
                el.textContent = resetTime;
            });
        }, 1000);

        document.getElementById('searchInput').addEventListener('input', () => renderCards(true));
    </script>
</body>
</html>
