<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rare Egg Tracker</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --primary: #bb86fc; --egg: #ffd700; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 1rem; }
        .search-box { width: 100%; max-width: 400px; padding: 10px 15px; border-radius: 8px; border: 1px solid #333; background-color: var(--surface); color: white; margin-bottom: 2rem; font-size: 1rem; }
        .search-box:focus { outline: none; border-color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; width: 100%; max-width: 1000px; }
        .card { background-color: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid #333; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .username { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .stat { margin: 5px 0; font-size: 0.95rem; display: flex; justify-content: space-between;}
        .stat.highlight { color: var(--egg); font-weight: bold; }
    </style>
</head>
<body>

    <h1>🥚 Rare Egg Tracker</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="ค้นหาชื่อผู้เล่น...">
    <div class="grid" id="dataGrid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://your-project-id-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const serversRef = ref(db, 'servers');
        let currentData = {};

        // ฟังก์ชันคำนวณเวลานับถอยหลัง 5 นาที จากเวลาโลกจริง (เรียลไทม์)
        function getRealWorldNightTimer() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const cycleLength = 300; // 5 นาที (300 วินาที)
            const remainingSeconds = cycleLength - (nowInSeconds % cycleLength);
            
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            
            const formattedMinutes = String(minutes).padStart(2, '0');
            const formattedSeconds = String(seconds).padStart(2, '0');
            
            return `${formattedMinutes}:${formattedSeconds}`;
        }

        onValue(serversRef, (snapshot) => {
            currentData = snapshot.val() || {};
            renderCards();
        });

        function renderCards() {
            const grid = document.getElementById('dataGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const realNightTime = getRealWorldNightTimer();
            grid.innerHTML = '';
            const now = Date.now();

            for (const [username, data] of Object.entries(currentData)) {
                // ซ่อนผู้เล่นที่ไม่ส่งข้อมูลเกิน 2 นาที
                if (now - data.lastUpdated > 120000) continue;

                if (username.toLowerCase().includes(search)) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="username">👤 ${username}</div>
                        <div class="stat highlight"><span>Rare Eggs:</span> <span>${data.eggCount} ฟอง</span></div>
                        <div class="stat"><span>Players:</span> <span>${data.playerCount} คน</span></div>
                        <div class="stat"><span>Night In:</span> <span class="night-timer">${realNightTime}</span></div>
                    `;
                    grid.appendChild(card);
                }
            }
        }

        setInterval(() => {
            const realNightTime = getRealWorldNightTimer();
            document.querySelectorAll('.night-timer').forEach(el => {
                el.textContent = realNightTime;
            });
        }, 1000);

        document.getElementById('searchInput').addEventListener('input', renderCards);
    </script>
</body>
</html>
